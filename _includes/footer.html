{% include base_path %}

<div class="page__footer-visitor">
  <span id="visitor_counter_preview">
    Visitor counter appears after deployment.
  </span>
  <span id="visitor_counter_live" hidden>
    <span id="busuanzi_container_site_uv">
      You are visitor No. <strong id="busuanzi_value_site_uv">...</strong>
    </span>
    <span class="page__footer-separator">·</span>
    <span id="busuanzi_container_page_pv">
      This page has been viewed <strong id="busuanzi_value_page_pv">...</strong> times.
    </span>
  </span>
</div>

<script>
  (function() {
    var host = window.location.hostname;
    var isLocalPreview = host === "localhost" || host === "127.0.0.1" || host === "";
    var preview = document.getElementById("visitor_counter_preview");
    var live = document.getElementById("visitor_counter_live");

    if (isLocalPreview) {
      return;
    }

    if (preview) {
      preview.hidden = true;
    }
    if (live) {
      live.hidden = false;
    }

    var script = document.createElement("script");
    script.async = true;
    script.src = "https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js";
    document.body.appendChild(script);
  }());
</script>
