{% include base_path %}

<meta charset="utf-8">

<script>
  (function () {
    var savedTheme;
    try {
      savedTheme = localStorage.getItem("site-theme");
    } catch (error) {
      savedTheme = null;
    }
    var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    var useDarkTheme = savedTheme ? savedTheme === "dark" : prefersDark;
    document.documentElement.classList.toggle("theme-dark", useDarkTheme);
    document.documentElement.style.colorScheme = useDarkTheme ? "dark" : "light";
  }());
</script>

{% include seo.html %}

{% if page.lang == "zh-CN" and page.en_url %}
  <link rel="alternate" hreflang="en" href="{{ base_path }}{{ page.en_url }}">
  <link rel="alternate" hreflang="zh-CN" href="{{ base_path }}{{ page.url }}">
{% elsif page.zh_url %}
  <link rel="alternate" hreflang="en" href="{{ base_path }}{{ page.url }}">
  <link rel="alternate" hreflang="zh-CN" href="{{ base_path }}{{ page.zh_url }}">
{% endif %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css?v={{ site.time | date: "%s" }}">

<meta http-equiv="cleartype" content="on">
