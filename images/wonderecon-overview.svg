<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">WonderEcon system overview</title>
  <desc id="desc">LLM agents make decisions through a four-step pipeline and interact across five markets. A human player can take over a household agent and compare counterfactual outcomes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#9a8bc5"/>
    </marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#303345}
      .muted{fill:#73798b}.small{font-size:13px}.label{font-size:15px;font-weight:600}.card{fill:#fff;stroke:#e4e1ef;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1000" height="620" rx="24" fill="#f7f6fc"/>
  <circle cx="925" cy="75" r="115" fill="#ddd4ff" opacity=".24"/>
  <circle cx="64" cy="554" r="120" fill="#cce5ff" opacity=".24"/>

  <text x="42" y="52" font-size="14" font-weight="700" letter-spacing="2" fill="#7650cf">INTERACTIVE ECONOMIC WORLD MODEL</text>
  <text x="42" y="91" font-size="29" font-weight="700">WonderEcon</text>
  <text x="42" y="116" font-size="15" class="muted">LLM agents, economic rules, and human-in-the-loop exploration</text>

  <!-- Agent roles -->
  <rect class="card" x="36" y="148" width="255" height="254" rx="18"/>
  <text x="58" y="180" class="label">Heterogeneous agents</text>
  <text x="58" y="201" class="small muted">Read news, form beliefs, make decisions</text>
  <g font-size="14" font-weight="600">
    <rect x="56" y="221" width="215" height="36" rx="10" fill="#f4f0ff"/><circle cx="76" cy="239" r="7" fill="#8866d6"/><text x="94" y="244">Households</text>
    <rect x="56" y="267" width="215" height="36" rx="10" fill="#eef5ff"/><circle cx="76" cy="285" r="7" fill="#5c8cdb"/><text x="94" y="290">Firms</text>
    <rect x="56" y="313" width="215" height="36" rx="10" fill="#eff9f5"/><circle cx="76" cy="331" r="7" fill="#55a888"/><text x="94" y="336">Banks &amp; central bank</text>
    <rect x="56" y="359" width="215" height="28" rx="9" fill="#fff5ec"/><circle cx="76" cy="373" r="6" fill="#e7a15f"/><text x="94" y="378">Government</text>
  </g>

  <!-- Market system -->
  <path d="M295 274h28" stroke="#9a8bc5" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect class="card" x="333" y="148" width="333" height="254" rx="18"/>
  <text x="357" y="180" class="label">Five connected markets</text>
  <text x="357" y="201" class="small muted">Economic rules close the macro loop</text>
  <g font-size="13" font-weight="600" text-anchor="middle">
    <rect x="356" y="222" width="132" height="52" rx="12" fill="#f4f0ff" stroke="#e7defb"/><text x="422" y="253">Labor</text>
    <rect x="510" y="222" width="132" height="52" rx="12" fill="#eef5ff" stroke="#dce8fb"/><text x="576" y="253">Goods</text>
    <rect x="356" y="294" width="132" height="52" rx="12" fill="#fff5ec" stroke="#f4e5d5"/><text x="422" y="325">Loans</text>
    <rect x="510" y="294" width="132" height="52" rx="12" fill="#eff9f5" stroke="#dcefe7"/><text x="576" y="325">Deposits</text>
    <rect x="433" y="360" width="132" height="30" rx="10" fill="#fff0f1" stroke="#f5dfe1"/><text x="499" y="380">Stocks</text>
  </g>
  <path d="M488 248h19M576 276v12M510 320h-18M422 294v-14M488 345l-15 14M550 359l-12-13" fill="none" stroke="#b6a9d9" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision pipeline -->
  <path d="M669 274h26" stroke="#9a8bc5" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect class="card" x="705" y="148" width="259" height="254" rx="18"/>
  <text x="729" y="180" class="label">LLM decision pipeline</text>
  <text x="729" y="201" class="small muted">Every decision is observable</text>
  <path d="M751 245v101" stroke="#d8d0eb" stroke-width="3"/>
  <g>
    <circle cx="751" cy="240" r="14" fill="#7650cf"/><text x="751" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><text x="778" y="245" font-size="14" font-weight="600">Observation</text>
    <circle cx="751" cy="277" r="14" fill="#6b63d3"/><text x="751" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><text x="778" y="282" font-size="14" font-weight="600">Belief</text>
    <circle cx="751" cy="314" r="14" fill="#5d70d3"/><text x="751" y="319" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><text x="778" y="319" font-size="14" font-weight="600">Price</text>
    <circle cx="751" cy="351" r="14" fill="#4c78d0"/><text x="751" y="356" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text><text x="778" y="356" font-size="14" font-weight="600">Action</text>
  </g>

  <!-- Human in the loop -->
  <rect x="36" y="425" width="928" height="155" rx="18" fill="#fff" stroke="#e4e1ef" stroke-width="1.5"/>
  <rect x="36" y="425" width="8" height="155" rx="4" fill="#7650cf"/>
  <text x="64" y="462" class="label">Human-in-the-loop counterfactual</text>
  <text x="64" y="488" class="small muted">Take over one household, change its decisions, and compare outcomes with the original agent.</text>
  <g font-size="12" font-weight="600" text-anchor="middle">
    <rect x="64" y="516" width="158" height="38" rx="12" fill="#f4f0ff"/><text x="143" y="540">Choose a household</text>
    <path d="M226 535h22" stroke="#9a8bc5" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="256" y="516" width="158" height="38" rx="12" fill="#eef5ff"/><text x="335" y="540">Make decisions</text>
    <path d="M418 535h22" stroke="#9a8bc5" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="448" y="516" width="178" height="38" rx="12" fill="#eff9f5"/><text x="537" y="540">Compare outcomes</text>
  </g>
  <rect x="672" y="458" width="260" height="94" rx="15" fill="#7650cf"/>
  <text x="696" y="489" font-size="12" font-weight="700" letter-spacing="1.2" fill="#e8e2ff">PLAYER PROFILE</text>
  <text x="696" y="521" font-size="20" font-weight="700" fill="#fff">Economic personality</text>
  <text x="696" y="540" font-size="12" fill="#f0edff">16 EPTI types from revealed choices</text>
</svg>
